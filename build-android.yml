name: Build NEXZORA GYM APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Capacitor Android and build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "NEXZORA GYM" "com.nexzora.gym" --web-dir=dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXZORA-GYM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk